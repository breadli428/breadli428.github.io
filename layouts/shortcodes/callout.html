{{- $kind := .Get 0 | default "note" -}}
<div class="callout {{ $kind }}">
  <div class="callout-icon" aria-hidden="true">
    {{- if in (slice "warning" "danger") $kind -}}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
    {{- else -}}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    {{- end -}}
  </div>
  <div>{{ .Inner | .Page.RenderString (dict "display" "block") }}</div>
</div>
