<header class="gnav{{ if .IsHome }} is-over-hero{{ end }}">
  <nav class="gnav-inner" aria-label="Main">
    <a class="gnav-brand" href="{{ "/" | relURL }}">{{ site.Params.header.navbar.logo.text | default site.Title }}</a>
    <ul class="gnav-links" id="gnav-links">
      {{- range site.Menus.main }}
      <li><a href="{{ .URL | relURL }}"{{ if strings.HasSuffix .URL ".pdf" }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
    <div class="gnav-tools">
      <button class="icon-btn" type="button" data-search aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg>
      </button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch theme">
        <svg data-theme-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg data-theme-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="icon-btn gnav-menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="gnav-links">
        <span></span><span></span>
      </button>
    </div>
  </nav>
</header>
