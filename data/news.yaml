# News items shown on the homepage (newest first).
# `highlight: true` marks milestones (papers, awards, new roles).
# `body` is HTML.
- date: '2026-09-30'
  title: I concluded my internship as a Student Researcher at Google DeepMind.
  highlight: true
  body: >-
    My time as a Student Researcher in the <a href="https://deepmind.google/models/gemini-robotics/" target="_blank" rel="noopener">Gemini Robotics</a> team at <a href="https://deepmind.google/" target="_blank" rel="noopener">Google DeepMind</a> has come to an end. Over these months, I worked on agentic learning with <a href="https://scholar.google.com/citations?user=79k7bGEAAAAJ&hl=en" target="_blank" rel="noopener">Nicolas Heess</a>. I am deeply grateful for his guidance and to the brilliant colleagues I had the privilege to learn from, and I look forward to carrying these experiences into my future research!
- date: '2026-09-15'
  title: I was invited as a speaker at the Modeling Uncertainty in Robotic World Models Workshop at CoRL 2026.
  highlight: true
  body: >-
    I am fortunate to be invited as a speaker at the <a href="https://uncertainwm2026.github.io/" target="_blank" rel="noopener">Modeling Uncertainty in Robotic World Models Workshop</a> at <a href="https://2026.corl.org/" target="_blank" rel="noopener">Conference on Robot Learning (CoRL) 2026</a>, together with <a href="https://people.csail.mit.edu/lpk/" target="_blank" rel="noopener">Leslie Kaelbling</a>, <a href="https://irom-lab.princeton.edu/majumdar/" target="_blank" rel="noopener">Anirudha Majumdar</a>, and <a href="https://cindycia.github.io/" target="_blank" rel="noopener">Panpan Cai</a>. The workshop will be held in Austin, United States on November 12, 2026.
- date: '2026-09-01'
  title: Three papers were accepted to CoRL 2026.
  highlight: true
  body: >-
    Our papers <a href="/publication/corl2026-2" target="_blank" rel="noopener"><em>EgoHTR: Egocentric 4D Demonstrations of Human Terrain Traversal</em></a>, <a href="/publication/corl2026-1" target="_blank" rel="noopener"><em>ADAPT: Agile Diffusion Action Priors for Robust and Steerable Online Text-Driven Humanoid Control</em></a>, and <a href="/publication/corl2026-3" target="_blank" rel="noopener"><em>Morphology-Conditioned World Model for Cross-Embodiment Quadrupedal Locomotion</em></a> were accepted by <a href="https://www.corl.org/" target="_blank" rel="noopener">Conference on Robot Learning (CoRL) 2026</a>. CoRL 2026 will be held in Austin, United States from November 9 to 12, 2026.
- date: '2026-04-22'
  title: I gave a talk on Online Reinforcement Learning at ARCAD Lab.
  body: >-
    I had the privilege of presenting my recent work on <a href="https://sites.google.com/view/roboticworldmodel" target="_blank" rel="noopener">Robotic World Model (RWM)</a> and <a href="https://sites.google.com/view/uncertainty-aware-rwm" target="_blank" rel="noopener">Uncertainty-Aware Robotic World Model (RWM-U)</a> at the <a href="https://sites.google.com/umich.edu/arcad-lab/home" target="_blank" rel="noopener">ARCAD Lab</a>, University of Michigan. In this talk, I discussed how we can leverage model-based methods for real-world online reinforcement learning in robotics, and how uncertainty awareness can be incorporated into the training of robotic world models to enhance policy optimization in imagination.
- date: '2026-04-10'
  title: I started as a Student Researcher at Google DeepMind.
  highlight: true
  body: >-
    I am excited to join the <a href="https://deepmind.google/models/gemini-robotics/" target="_blank" rel="noopener">Gemini Robotics</a> team and contribute to the research in embodied intelligence and robot learning. It is a great honor to work with the brilliant minds at <a href="https://deepmind.google/" target="_blank" rel="noopener">Google DeepMind</a> and I look forward to the exciting research opportunities ahead!
- date: '2026-02-21'
  title: Our work was accepted to CVPR 2026.
  highlight: true
  body: >-
    Our work <a href="/publication/cvpr2026" target="_blank" rel="noopener"><em>NIL: No-data Imitation Learning</em></a> was accepted by <a href="https://cvpr.thecvf.com/" target="_blank" rel="noopener">IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR) 2026</a>. CVPR 2026 will be held in Denver, United States from Jun 03 to 07, 2026.
- date: '2025-12-06'
  title: Our work received the Outstanding Paper Award at the EWM Workshop, NeurIPS, San Diego, United States.
  highlight: true
  body: >-
    It was announced during <a href="https://neurips.cc/" target="_blank" rel="noopener">Conference on Neural Information Processing Systems (NeurIPS) 2025</a> in San Diego, United States that our work <a href="/publication/neurips2025" target="_blank" rel="noopener"><em>Robotic World Model: A Neural Network Simulator for Robust Policy Optimization in Robotics</em></a> received the outstanding paper award at the <a href="https://embodied-world-models.github.io/" target="_blank" rel="noopener">Embodied World Models for Decision Making Workshop</a>. As one of fifty accepted papers, our work received great acknowledgment from the community.
- date: '2025-10-02'
  title: Our workshop at the 2025 International Conference on Humanoid Robots concluded with great success.
  body: >-
    Together with <a href="https://www.linkedin.com/in/julian-esser/" target="_blank" rel="noopener">Julian Eßer</a>, <a href="https://gmargo11.github.io/" target="_blank" rel="noopener">Gabe Margolis</a>, and <a href="http://hxu.rocks/" target="_blank" rel="noopener">Huazhe Xu</a>, I had the privilege of organizing the <a href="https://sites.google.com/view/sim-to-real-humanoids/home" target="_blank" rel="noopener">Sim-to-Real Transfer for Humanoid Robots Workshop</a> at the <a href="https://2025humanoids.org/" target="_blank" rel="noopener">2025 International Conference on Humanoid Robots</a> in Seoul, South Korea. The workshop brought together leading researchers and practitioners to discuss the latest advances and challenges in bridging the gap between simulation and real-world humanoid control.
- date: '2025-09-17'
  title: I gave a talk on Learning from Demonstrations at MyoLab.
  body: >-
    In this <a href="https://t.co/cQxQ2GNe5S" target="_blank" rel="noopener">talk</a>, I had the privilege of presenting a comprehensive overview of my experience in the field of Learning from Demonstrations. I discussed the evolution of LfD techniques from feature-based methods to modern generative approaches such as GAN-based learning, and highlighted how these methods have shaped current trends in both robotics and character animation.
- date: '2025-08-08'
  title: Two papers were accepted to CoRL 2025.
  highlight: true
  body: >-
    Our papers <a href="/publication/corl2025-3" target="_blank" rel="noopener"><em>Motion Priors Reimagined: Adapting Flat-Terrain Skills for Complex Quadruped Mobility</em></a> and <a href="/publication/corl2025-4" target="_blank" rel="noopener"><em>Constrained Style Learning from Imperfect Demonstrations under Task Optimality</em></a> were accepted by <a href="https://www.corl.org/" target="_blank" rel="noopener">Conference on Robot Learning (CoRL) 2025</a>. CoRL 2025 will be held in Seoul, South Korea from September 27 to 30, 2025.
- date: '2025-07-15'
  title: We published a survey on Learning from Demonstrations.
  body: >-
    While learning from demonstrations has become a widely adopted strategy, many practitioners choose methods based on precedent or anecdotal success rather than a systematic understanding of the algorithmic factors driving performance. Drawing on our extensive experience in the field, we developed <a href="/post/lfd" target="_blank" rel="noopener"><em>Feature-Based vs. GAN-Based Imitation: When and Why</em></a>, a comprehensive survey designed to provide structured guidance and serve as a practical resource for the community.
- date: '2025-01-27'
  title: Our work was accepted to ICRA 2025.
  highlight: true
  body: >-
    Our work <a href="/publication/icra2025" target="_blank" rel="noopener"><em>DFM: Deep Fourier Mimic for Expressive Dance Motion Learning</em></a> was accepted by <a href="https://2025.ieee-icra.org/" target="_blank" rel="noopener">IEEE International Conference on Robotics and Automation (ICRA) 2025</a>. ICRA 2025 will be held in Atlanta, United States from May 19 to 23, 2025.
- date: '2024-10-08'
  title: Our work was accepted to NeurIPS 2024.
  highlight: true
  body: >-
    Our work <em>Dataset and Lessons Learned from the 2024 SaTML LLM Capture-the-Flag Competition</em> was accepted by <a href="https://neurips.cc/" target="_blank" rel="noopener">The Thirty-Eighth Annual Conference on Neural Information Processing Systems (NeurIPS) 2024</a>. NeurIPS 2024 will be held in Vancouver, Canada from Dec 10 to 15, 2024.
- date: '2024-04-05'
  title: I received the ETH Medal at my master's graduation ceremony.
  highlight: true
  body: >-
    I feel extremely honored to receive the <a href="https://ethz.ch/en/the-eth-zurich/education/awards/eth-medal.html#" target="_blank" rel="noopener">ETH Medal</a> at my master's graduation ceremony at <a href="https://ethz.ch/en.html" target="_blank" rel="noopener">ETH Zurich</a>. The ETH Medal is awarded to students with outstanding master's and doctoral theses. I am deeply grateful and view this as recognition and acknowledgment of my work during my master's studies. I would like to express my sincere gratitude to my advisors <a href="https://al.is.mpg.de/person/gmartius" target="_blank" rel="noopener">Prof. Georg Martius</a>, <a href="https://meche.mit.edu/people/faculty/SANGBAE@MIT.EDU" target="_blank" rel="noopener">Prof. Sangbae Kim</a>, and especially <a href="https://mavt.ethz.ch/people/person-detail.hutter.html" target="_blank" rel="noopener">Prof. Marco Hutter</a> for their guidance and support.
- date: '2024-04-05'
  title: An unforgettable reunion of friends at my master's graduation ceremony.
  body: >-
    The <a href="https://ethz.ch/en/the-eth-zurich/education/awards/eth-medal.html#" target="_blank" rel="noopener">graduation ceremony</a> officially concludes my master's studies at <a href="https://ethz.ch/en.html" target="_blank" rel="noopener">ETH Zurich</a>. It was an unforgettable reunion of friends who shared this great journey with me. I am grateful for the opportunity to have met so many wonderful people during my studies. I am excited to see where our paths will lead us next.
- date: '2024-03-13'
  title: Our work was accepted to ICLR 2024 Generative Models for Decision Making workshop.
  body: >-
    Our work <a href="/publication/iclr2024" target="_blank" rel="noopener"><em>FLD: Fourier Latent Dynamics for Structured Motion Representation and Learning</em></a> was accepted to the <a href="https://sites.google.com/view/genai4dm-iclr2024" target="_blank" rel="noopener">Generative Models for Decision Making (GenAI4DM)</a> workshop at <a href="https://iclr.cc/" target="_blank" rel="noopener">The Twelfth International Conference on Learning Representations (ICLR)</a>. This workshop aims to bring together researchers and practitioners from the fields of generative AI and decision making to explore the latest advances, methodologies, and applications.
- date: '2024-03-04'
  title: Our defense won second prize in the LLM CTF competition at IEEE SaTML 2024.
  body: >-
    Our team won second prize with our Llama-2-70b-chat defense in the <a href="https://ctf.spylab.ai/" target="_blank" rel="noopener">Large Language Models Capture-the-Flag (LLM CTF) competition</a> at <a href="https://satml.org/" target="_blank" rel="noopener">2024 IEEE Conference on Secure and Trustworthy Machine Learning (SaTML)</a>. In this competition, participants assume the roles of defenders who craft prompts and filters to instruct an LLM to keep a secret, aiming to prevent its discovery in a conversation.
- date: '2024-01-29'
  title: Our work was accepted to ICRA 2024.
  highlight: true
  body: >-
    Our work <a href="/publication/icra2024" target="_blank" rel="noopener"><em>Learning Diverse Skills for Local Navigation under Multi-constraint Optimality</em></a> was accepted by <a href="https://2024.ieee-icra.org/" target="_blank" rel="noopener">IEEE International Conference on Robotics and Automation (ICRA) 2024</a>. ICRA 2024 will be held in Yokohama, Japan from May 13 to 17, 2024.
- date: '2024-01-16'
  title: Our work was accepted to ICLR 2024 for a spotlight presentation.
  highlight: true
  body: >-
    Our work <a href="/publication/iclr2024" target="_blank" rel="noopener"><em>FLD: Fourier Latent Dynamics for Structured Motion Representation and Learning</em></a> was accepted by <a href="https://iclr.cc/" target="_blank" rel="noopener">The Twelfth International Conference on Learning Representations (ICLR)</a> for a spotlight presentation. ICLR 2024 will be held in Vienna, Austria from May 7 to 11, 2024.
- date: '2023-11-01'
  title: I started my Ph.D. journey as a doctoral fellow at ETH AI Center.
  body: >-
    I am excited to share that I started my Ph.D. program as a doctoral fellow at <a href="https://ai.ethz.ch/" target="_blank" rel="noopener">ETH AI Center</a> at <a href="https://ethz.ch/en.html" target="_blank" rel="noopener">ETH Zurich</a>, Switzerland. I am honored to be co-supervised by <a href="https://las.inf.ethz.ch/krausea" target="_blank" rel="noopener">Prof. Andreas Krause</a> and <a href="https://mavt.ethz.ch/people/person-detail.hutter.html" target="_blank" rel="noopener">Prof. Marco Hutter</a>.
- date: '2023-10-03'
  title: I finished my visit at the Biomimetic Robotics Lab at MIT.
  body: >-
    I am thrilled to wrap up my visit with the talented team at the <a href="https://biomimetics.mit.edu/" target="_blank" rel="noopener">Biomimetic Robotics Lab</a> at <a href="https://www.mit.edu/" target="_blank" rel="noopener">Massachusetts Institute of Technology (MIT)</a>, Cambridge, United States. It has been an invaluable experience, collaborating on cutting-edge legged robotics. I am eager to see our collective efforts make a meaningful impact on the robot learning community!
- date: '2023-06-03'
  title: Great time at ICRA 2023.
  body: >-
    It was wonderful to have met my old and new friends during <a href="https://www.icra2023.org/" target="_blank" rel="noopener">IEEE International Conference on Robotics and Automation (ICRA) 2023</a> in London, United Kingdom. I am excited to see that our work <a href="/publication/icra2023" target="_blank" rel="noopener"><em>Versatile Skill Control via Self-supervised Adversarial Imitation of Unlabeled Mixed Motions</em></a> has been acknowledged by the greatest roboticists in the field. Thanks to the team <a href="https://sblaes.com/" target="_blank" rel="noopener">Sebastian Blaes</a>, <a href="https://pavelkolev.github.io/" target="_blank" rel="noopener">Pavel Kolev</a>, <a href="https://jimimvp.github.io/" target="_blank" rel="noopener">Marin Vlastelica</a>, <a href="https://www.linkedin.com/in/jonas-frey-3a3702175/" target="_blank" rel="noopener">Jonas Frey</a> and <a href="https://al.is.mpg.de/person/gmartius" target="_blank" rel="noopener">Georg Martius</a>, who made this work possible.
- date: '2023-04-27'
  title: Our work was accepted to ICRA 2023 Agile Movements workshop.
  body: >-
    Our work <a href="/publication/icra2023" target="_blank" rel="noopener"><em>Versatile Skill Control via Self-supervised Adversarial Imitation of Unlabeled Mixed Motions</em></a> was accepted to the <a href="https://sites.google.com/view/agilemovement-2023icra/home" target="_blank" rel="noopener">Agile Movements: Animal Behavior, Biomechanics, and Robot Devices</a> workshop at <a href="https://www.icra2023.org/" target="_blank" rel="noopener">IEEE International Conference on Robotics and Automation (ICRA) 2023</a>. This workshop invites researchers to identify the challenges and opportunities of understanding and improving robotic agility from a diverse range of areas, including biology, biomechanics, mechanism design, and control.
- date: '2023-03-02'
  title: I received the ETH AI Center Doctoral Fellowship.
  highlight: true
  body: >-
    I am excited to share that I received the <a href="https://ai.ethz.ch/education/phd-and-postdoc-programs/phd-fellowships.html" target="_blank" rel="noopener">ETH AI Center Doctoral Fellowship</a> at <a href="https://ethz.ch/en.html" target="_blank" rel="noopener">ETH Zurich</a>, Switzerland. The ETH AI Center Fellowship is awarded to doctoral students, who are co-supervised by two faculty members from different departments within ETH Zurich, thus fostering a culture of interdisciplinary exchange and collaboration. I am extremely honored to receive this offer from <a href="https://las.inf.ethz.ch/krausea" target="_blank" rel="noopener">Prof. Andreas Krause</a> and <a href="https://mavt.ethz.ch/people/person-detail.hutter.html" target="_blank" rel="noopener">Prof. Marco Hutter</a>.
- date: '2023-02-16'
  title: Our work on Solo robots at MPI-IS was reported by a German TV network.
  body: >-
    My work on Solo robots during my internship at the <a href="https://is.mpg.de/" target="_blank" rel="noopener">Max Planck Institute for Intelligent Systems</a> was covered in <a href="https://www.3sat.de/wissen/nano" target="_blank" rel="noopener">NANO</a> on <a href="https://www.3sat.de/" target="_blank" rel="noopener">3sat</a>. In the <a href="https://www.3sat.de/wissen/nano/230216-sendung-nutzung-der-polizei-software-eingeschraenkt-nano-100.html" target="_blank" rel="noopener">coverage</a>, <a href="https://al.is.mpg.de/person/gmartius" target="_blank" rel="noopener">Prof. Georg Martius</a> explained how autonomous learning systems can obtain extraordinary intelligence from interactions with the environment.
- date: '2023-02-04'
  title: I received admission offers to the Ph.D. programs at MIT EECS and other prominent institutes.
  highlight: true
  body: >-
    I am excited to share that I received admission offers to the Ph.D. programs at the departments of <a href="https://www.eecs.mit.edu/" target="_blank" rel="noopener">Electrical Engineering and Computer Science (EECS)</a> and <a href="https://meche.mit.edu/" target="_blank" rel="noopener">Mechanical Engineering (MechE)</a> at <a href="https://www.mit.edu/" target="_blank" rel="noopener">Massachusetts Institute of Technology (MIT)</a>, Cambridge, United States. I was also lucky to be admitted to the <a href="https://www.ri.cmu.edu/" target="_blank" rel="noopener">Robotics Institute</a> at <a href="https://www.cmu.edu/" target="_blank" rel="noopener">Carnegie Mellon University (CMU)</a>, Pittsburgh, United States. I am honored and view these as recognition and acknowledgment of my work during my master's studies.
- date: '2023-01-16'
  title: Our work was accepted to ICRA 2023.
  highlight: true
  body: >-
    Our work <a href="/publication/icra2023" target="_blank" rel="noopener"><em>Versatile Skill Control via Self-supervised Adversarial Imitation of Unlabeled Mixed Motions</em></a> was accepted by <a href="https://www.icra2023.org/" target="_blank" rel="noopener">IEEE International Conference on Robotics and Automation (ICRA)</a>. ICRA 2023 will be held in London, United Kingdom from May 29 to June 2, 2023.
- date: '2023-01-09'
  title: I started my visit at Biomimetic Robotics Lab at MIT.
  body: >-
    Starting from January, I am honored to work with <a href="https://meche.mit.edu/people/faculty/SANGBAE@MIT.EDU" target="_blank" rel="noopener">Prof. Sangbae Kim</a> at <a href="https://biomimetics.mit.edu/" target="_blank" rel="noopener">Biomimetic Robotics Lab</a> at <a href="https://www.mit.edu/" target="_blank" rel="noopener">Massachusetts Institute of Technology (MIT)</a>, Cambridge, United States. My main research topic focuses on developing latent skill representation for the <a href="https://spectrum.ieee.org/mit-dynamic-acrobatic-humanoid-robot" target="_blank" rel="noopener">MIT Humanoid</a> robot. I am happy to collaborate with <a href="https://sheim.github.io/" target="_blank" rel="noopener">Steve Heim</a> and <a href="https://www.linkedin.com/in/elijah-stanger-jones-216b10126/" target="_blank" rel="noopener">Elijah Stanger-Jones</a> on this exciting topic.
- date: '2022-12-19'
  title: Great time at CoRL 2022 and satisfying results for my first publication.
  body: >-
    It was wonderful to have met all the great names and my future collaborators and advisors during <a href="https://corl2022.org/" target="_blank" rel="noopener">Conference on Robot Learning (CoRL) 2022</a> in Auckland, New Zealand. I am excited to see that our work <a href="/publication/corl2022" target="_blank" rel="noopener"><em>Learning Agile Skills via Adversarial Imitation of Rough Partial Demonstrations</em></a> has been acknowledged by the greatest roboticists in the field and was named a finalist for the Best Paper Award. Thanks to the team <a href="https://jimimvp.github.io/" target="_blank" rel="noopener">Marin Vlastelica</a>, <a href="https://sblaes.com/" target="_blank" rel="noopener">Sebastian Blaes</a>, <a href="https://www.linkedin.com/in/jonas-frey-3a3702175/" target="_blank" rel="noopener">Jonas Frey</a>, <a href="https://is.mpg.de/person/fgrimmin" target="_blank" rel="noopener">Felix Grimminger</a> and <a href="https://al.is.mpg.de/person/gmartius" target="_blank" rel="noopener">Georg Martius</a>, who made this achievement possible.
- date: '2022-12-16'
  title: Our work was named a finalist for the Best Paper Award at CoRL 2022, Auckland, New Zealand.
  highlight: true
  body: >-
    It was announced during <a href="https://corl2022.org/" target="_blank" rel="noopener">Conference on Robot Learning (CoRL) 2022</a> in Auckland, New Zealand that our work <a href="/publication/corl2022" target="_blank" rel="noopener"><em>Learning Agile Skills via Adversarial Imitation of Rough Partial Demonstrations</em></a> was named a finalist for the Best Paper Award. As one of the three nominated papers, our work received great acknowledgment from the community.
- date: '2022-12-02'
  title: Our work was presented to the Machines in Motion Laboratory, New York University, United States.
  body: >-
    Our work <a href="/publication/corl2022" target="_blank" rel="noopener"><em>Learning Agile Skills via Adversarial Imitation of Rough Partial Demonstrations</em></a> was presented to the scholars at the <a href="https://wp.nyu.edu/machinesinmotion/" target="_blank" rel="noopener">Machines in Motion Laboratory</a> led by <a href="http://wp.nyu.edu/machinesinmotion/89-2/" target="_blank" rel="noopener">Prof. Ludovic Righetti</a> at <a href="https://www.nyu.edu/" target="_blank" rel="noopener">New York University</a>. The Machines in Motion Laboratory focuses on understanding the fundamental principles for robot locomotion and manipulation that will endow robots with the robustness and adaptability necessary to efficiently and autonomously act in an unknown and changing environment.
- date: '2022-11-25'
  title: I will join the Biomimetic Robotics Lab at MIT for my master thesis.
  body: >-
    I am glad to share that I will join the <a href="https://biomimetics.mit.edu/" target="_blank" rel="noopener">Biomimetic Robotics Lab</a> led by <a href="https://meche.mit.edu/people/faculty/SANGBAE@MIT.EDU" target="_blank" rel="noopener">Prof. Sangbae Kim</a> at <a href="https://www.mit.edu/" target="_blank" rel="noopener">Massachusetts Institute of Technology (MIT)</a> to complete my master thesis later this year. The Biomimetic Robotics Lab focuses on designing and controlling robots using insights taken from the natural world. I will be working with the <a href="https://spectrum.ieee.org/mit-dynamic-acrobatic-humanoid-robot" target="_blank" rel="noopener">MIT Humanoid</a> on human demonstration imitation.
- date: '2022-11-22'
  title: Our work was accepted to CoRL 2022 Learning for Agile Robotics workshop.
  body: >-
    Our work <a href="/publication/corl2022" target="_blank" rel="noopener"><em>Learning Agile Skills via Adversarial Imitation of Rough Partial Demonstrations</em></a> was accepted to the <a href="https://www.agilerobotscorl2022.com/" target="_blank" rel="noopener">Learning for Agile Robotics</a> workshop at <a href="https://corl2022.org/" target="_blank" rel="noopener">Conference on Robot Learning (CoRL) 2022</a>. This workshop invites researchers working on making agile robots. The goals include fostering collaboration, understanding the current limitations and inefficiencies, learning common ideas on modern ML based approaches, etc.
- date: '2022-11-21'
  title: Our work made it into the Video Friday collection at IEEE Spectrum again.
  body: >-
    Our work <a href="/publication/corl2022" target="_blank" rel="noopener"><em>Learning Agile Skills via Adversarial Imitation of Rough Partial Demonstrations</em></a> was covered by <a href="https://spectrum.ieee.org/video-friday-little-robot-big-stairs" target="_blank" rel="noopener">Video Friday collection</a> at <a href="https://spectrum.ieee.org/" target="_blank" rel="noopener">IEEE Spectrum</a>. Video Friday is a weekly selection of state-of-the-art robotics videos, collected by scholars at <a href="https://spectrum.ieee.org/topic/robotics/" target="_blank" rel="noopener">IEEE Spectrum Robotics</a>. This time, our <a href="https://www.youtube.com/watch?v=WZf67Qik6Fc" target="_blank" rel="noopener"><em>overview video</em></a> was selected and well acknowledged.
- date: '2022-09-15'
  title: Our work was submitted to IEEE International Conference on Robotics and Automation (ICRA) 2023.
  body: >-
    During the second three months of my internship, I accomplished the work <a href="/publication/icra2023" target="_blank" rel="noopener"><em>Versatile Skill Control via Self-supervised Adversarial Imitation of Unlabeled Mixed Motions</em></a> under the guidance of <a href="https://sblaes.com/" target="_blank" rel="noopener">Sebastian Blaes</a>, <a href="https://pavelkolev.github.io/" target="_blank" rel="noopener">Pavel Kolev</a>, <a href="https://jimimvp.github.io/" target="_blank" rel="noopener">Marin Vlastelica</a>, <a href="https://www.linkedin.com/in/jonas-frey-3a3702175/" target="_blank" rel="noopener">Jonas Frey</a> and <a href="https://al.is.mpg.de/person/gmartius" target="_blank" rel="noopener">Prof. Georg Martius</a>. In this work, <a href="https://open-dynamic-robot-initiative.github.io/" target="_blank" rel="noopener">Solo</a> obtained diverse skills by imitating unlabeled, mixed reference motions.
- date: '2022-09-10'
  title: Our work was accepted to CoRL 2022 for an oral presentation with a Best Paper Award nomination.
  highlight: true
  body: >-
    Our work <a href="/publication/corl2022" target="_blank" rel="noopener"><em>Learning Agile Skills via Adversarial Imitation of Rough Partial Demonstrations</em></a> was accepted by <a href="https://corl2022.org/" target="_blank" rel="noopener">Conference on Robot Learning (CoRL) 2022</a> for an oral presentation with a Best Paper Award nomination. CoRL 2022 will be held in Auckland, New Zealand from December 14 to 18, 2022.
- date: '2022-08-10'
  title: Our work was presented to the Robotic Systems Lab, ETH Zurich, Switzerland.
  body: >-
    Our work <a href="/publication/corl2022" target="_blank" rel="noopener"><em>Learning Agile Skills via Adversarial Imitation of Rough Partial Demonstrations</em></a> was presented to the scholars at the <a href="https://rsl.ethz.ch/" target="_blank" rel="noopener">Robotic Systems Lab (RSL)</a>, <a href="https://ethz.ch/en.html" target="_blank" rel="noopener">ETH Zurich</a> during the research presentation. In this weekly event, internal and external researchers are invited to present their state-of-the-art discoveries in fields including robotic system integration and control methods.
- date: '2022-07-02'
  title: Our work was presented to the public at the Science & Innovation Days, Tübingen.
  body: >-
    The <a href="https://youtube.com/playlist?list=PLhqs0Oka9VRFrKb9djmEBU-NyewCKHfGP" target="_blank" rel="noopener">experiments</a> of our work <a href="/publication/corl2022" target="_blank" rel="noopener"><em>Learning Agile Skills via Adversarial Imitation of Rough Partial Demonstrations</em></a> were presented to the public at the <a href="https://uni-tuebingen.de/en/universitaet/campusleben/veranstaltungen/zentrale-veranstaltungen/science-innovation-days/" target="_blank" rel="noopener">Tübingen Science & Innovation Days</a>. In this event, research institutes including the <a href="https://is.mpg.de/" target="_blank" rel="noopener">Max Planck Institute for Intelligent Systems</a> open their doors to the interested public and present their research.
- date: '2022-07-01'
  title: Our work made it into the Video Friday collection at IEEE Spectrum.
  body: >-
    Our work <a href="/publication/corl2022" target="_blank" rel="noopener"><em>Learning Agile Skills via Adversarial Imitation of Rough Partial Demonstrations</em></a> was covered by <a href="https://spectrum.ieee.org/video-friday-pokebo-cubes" target="_blank" rel="noopener">Video Friday collection</a> at <a href="https://spectrum.ieee.org/" target="_blank" rel="noopener">IEEE Spectrum</a>. Video Friday is a weekly selection of state-of-the-art robotics videos, collected by scholars at <a href="https://spectrum.ieee.org/topic/robotics/" target="_blank" rel="noopener">IEEE Spectrum Robotics</a>. Among our selected videos, <a href="https://www.youtube.com/watch?v=GDlylFsp9so" target="_blank" rel="noopener"><em>SOLOBACKFLIP</em></a> gained particular popularity.
- date: '2022-06-29'
  title: Our work was presented to scholars from the International Max Planck Research School for Intelligent Systems.
  body: >-
    Our work <a href="/publication/corl2022" target="_blank" rel="noopener"><em>Learning Agile Skills via Adversarial Imitation of Rough Partial Demonstrations</em></a> was presented to the evaluation committee and Ph.D. scholars from the <a href="https://imprs.is.mpg.de/" target="_blank" rel="noopener">International Max Planck Research School for Intelligent Systems (IMPRS)</a> during the on-site evaluation.
- date: '2022-06-15'
  title: Our work was submitted to Conference on Robot Learning (CoRL) 2022.
  body: >-
    During the first three months of my internship, I accomplished the work <a href="/publication/corl2022" target="_blank" rel="noopener"><em>Learning Agile Skills via Adversarial Imitation of Rough Partial Demonstrations</em></a> under the guidance of <a href="https://jimimvp.github.io/" target="_blank" rel="noopener">Marin Vlastelica</a>, <a href="https://sblaes.com/" target="_blank" rel="noopener">Sebastian Blaes</a>, <a href="https://www.linkedin.com/in/jonas-frey-3a3702175/" target="_blank" rel="noopener">Jonas Frey</a>, <a href="https://is.mpg.de/person/fgrimmin" target="_blank" rel="noopener">Felix Grimminger</a> and <a href="https://al.is.mpg.de/person/gmartius" target="_blank" rel="noopener">Prof. Georg Martius</a>. In this work, <a href="https://open-dynamic-robot-initiative.github.io/" target="_blank" rel="noopener">Solo</a> developed highly dynamic skills by imitating rough, partial, human-demonstrated reference motions.
- date: '2022-04-01'
  title: I started my internship at Autonomous Learning Group at Max Planck Institute for Intelligent Systems.
  body: >-
    Starting from April, I am honored to work with <a href="https://al.is.mpg.de/person/gmartius" target="_blank" rel="noopener">Prof. Georg Martius</a> at <a href="https://al.is.mpg.de/" target="_blank" rel="noopener">Autonomous Learning Group</a> at <a href="https://is.mpg.de/" target="_blank" rel="noopener">Max Planck Institute for Intelligent Systems (MPI-IS)</a>, Tübingen, Germany. My main research topic focuses on agile skill development and style diversification for <a href="https://open-dynamic-robot-initiative.github.io/" target="_blank" rel="noopener">Solo</a> robot. This work is closely collaborated with <a href="https://rsl.ethz.ch/" target="_blank" rel="noopener">Robotic Systems Lab (RSL)</a>, <a href="https://ethz.ch/en.html" target="_blank" rel="noopener">ETH Zurich</a>, Switzerland.
- date: '2022-03-30'
  title: My semester project at Robotic Systems Lab (RSL) finished with successful policy deployment on the real system.
  body: >-
    By employing a novel compositional control structure, <a href="https://www.anybotics.com/anymal-autonomous-legged-robot/" target="_blank" rel="noopener">ANYmal</a> learned to achieve full-pose trajectory tracking in a global coordinate system. A hierarchical system pipeline was introduced, where the high-level policy processes global target information and outputs low-level composition signals and commands with trivial regularization.
- date: '2021-10-01'
  title: I started my semester project at Robotic Systems Lab (RSL), ETH Zurich, Switzerland.
  body: >-
    From October, I am honored to work on a semester project on the skill integration for ANYmal with hierarchical reinforcement learning at <a href="https://rsl.ethz.ch/" target="_blank" rel="noopener">Robotic Systems Lab (RSL)</a> directed by <a href="https://mavt.ethz.ch/people/person-detail.hutter.html" target="_blank" rel="noopener">Prof. Marco Hutter</a>. The main research topic focuses on extending locomotion and manipulation capabilities for legged systems by leveraging appropriate combination of acquired skills. This project is mainly supervised by <a href="https://scholar.google.com/citations?user=do0paQsAAAAJ&hl=en" target="_blank" rel="noopener">Yuntao Ma</a>, <a href="https://scholar.google.com/citations?user=nOl83tYAAAAJ&hl=en" target="_blank" rel="noopener">Takahiro Miki</a> and <a href="https://mayankm96.github.io/" target="_blank" rel="noopener">Mayank Mittal</a>.
- date: '2021-09-01'
  title: I started my teaching assistant position for Linear & Combinatorial Optimization at ETH Zurich, Switzerland.
  body: >-
    After having achieved top grades in the course <a href="http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?lerneinheitId=146748&semkez=2021W&ansicht=LEHRVERANSTALTUNGEN&lang=en" target="_blank" rel="noopener">Linear & Combinatorial Optimization (L&CO, 11 ECTS)</a> instructed by <a href="https://math.ethz.ch/ifor/groups/zenklusen_group/rico-zenklusen.html" target="_blank" rel="noopener">Prof. Rico Zenklusen</a> at <a href="https://ethz.ch/en.html" target="_blank" rel="noopener">ETH Zurich</a> last semester, I was honored to take a teaching assistant position for the new semester. Among my responsibilities, I enjoyed delivering lectures the most.
- date: '2021-07-09'
  title: Wonderful week at ETH Robotics Summer School in Wangen an der Aare, Switzerland.
  body: >-
    From July 2 to 9, I was honored to participate in the <a href="https://robotics-summerschool.ethz.ch/" target="_blank" rel="noopener">ETH Robotics Summer School</a> directed by <a href="https://center-for-robotics.ethz.ch/education.html" target="_blank" rel="noopener">ETH RobotX initiative</a>. During this event, a broad scope of components of autonomous mobile robots including state estimation, trajectory optimization, environment mapping, path planning, and artifact detection were introduced and implemented on a wheeled platform, <a href="https://unlimited.ethz.ch/display/ROBOTX/SuperMegaBot" target="_blank" rel="noopener">SuperMegaBot</a>. On the last day, we successfully completed an autonomous rescue challenge at the test site.
- date: '2020-09-01'
  title: I started my master's program in Robotics, Systems and Control at ETH Zurich, Switzerland.
  body: >-
    After receiving offers from top-class universities including <a href="https://www.ucla.edu/" target="_blank" rel="noopener">University of California, Los Angeles (UCLA)</a>, <a href="https://www.jhu.edu/" target="_blank" rel="noopener">Johns Hopkins University (JHU)</a>, <a href="https://www.epfl.ch/en/" target="_blank" rel="noopener">École polytechnique fédérale de Lausanne (EPFL)</a>, <a href="https://www.imperial.ac.uk/" target="_blank" rel="noopener">Imperial College London</a>, etc, I decided to pursue my future endeavors in <a href="https://ethz.ch/en/studies/master/degree-programmes/engineering-sciences/robotics-systems-and-control.html" target="_blank" rel="noopener">Robotics, Systems and Control</a> under the guidance of <a href="https://mavt.ethz.ch/people/person-detail.hutter.html" target="_blank" rel="noopener">Prof. Marco Hutter</a> at <a href="https://ethz.ch/en.html" target="_blank" rel="noopener">ETH Zurich</a>, Switzerland.
- date: '2020-06-15'
  title: I was awarded Excellent Graduate of Shanghai.
  body: >-
    Together with 11 other students from the School of Mechanical Engineering, it was my honor to be granted the highest honor for all undergraduates of all majors from more than ten universities in Shanghai this year.
- date: '2020-02-01'
  title: My research project at Biorobotics Laboratory (BioRob) finished with successful hardware test.
  body: >-
    My work on <em>Analysis, Design and Implementation of a Bio-inspired Passive Tail for Amphibious Robots</em> concluded with a novel development of an appropriate chordwise stiffness distribution along a bio-inspired tail for <a href="https://www.epfl.ch/labs/biorob/research/amphibious/agnathax/" target="_blank" rel="noopener">AgnathaX</a> which maximizes the propulsion generated under a combined movement of both passive heaving and pitching.
- date: '2019-09-01'
  title: I started my research project at Biorobotics Laboratory (BioRob) at École polytechnique fédérale de Lausanne (EPFL), Switzerland.
  body: >-
    I am honored to work as a research assistant on the design of a bio-inspired passive tail for amphibious robots at <a href="https://www.epfl.ch/labs/biorob/" target="_blank" rel="noopener">Biorobotics Laboratory (BioRob)</a> directed by <a href="https://www.epfl.ch/labs/biorob/people/ijspeert/" target="_blank" rel="noopener">Prof. Auke Ijspeert</a> during the last year of my bachelor's study. This project is mainly supervised by <a href="https://www.epfl.ch/labs/biorob/people/paez/" target="_blank" rel="noopener">Laura Paez</a>.
- date: '2018-11-16'
  title: I was awarded my second National Scholarship for my study at Tongji University, Shanghai, China.
  body: >-
    The Ministry of Education of China funded the China National Scholarship to award outstanding full-time undergraduates for their excellent academic records. Being among the top 1% of the students of the same year again, I am honored to receive this award a second time.
- date: '2018-10-01'
  title: I finished my research internship at Advanced Multifunctional and Multiphysics Metamaterials Lab (AM3L) of the Department of Bioresource Engineering of McGill University, Montréal, Canada.
  body: >-
    From July to October, I was honored to be selected for the <a href="https://www.mitacs.ca/en/programs/globalink/globalink-research-internship" target="_blank" rel="noopener">Mitacs Globalink Research Internship</a> program and to work on <em>Design and 3D Printing of Lightweight Advanced Energy Harvesters Made of Smart Materials</em> under the supervision of <a href="https://www.mcgill.ca/bioeng/faculty-and-staff/academic-staff/abdolhamid-akbarzadeh-shafaroudi" target="_blank" rel="noopener">Prof. Abdolhamid Akbarzadeh</a>. The research was devoted to reinforcing mechanical properties of 3D printing materials by combining pulverized wood particles with melted polymer through a novel process of extrusion.
- date: '2018-04-01'
  title: I was awarded Meritorious Winner in 2018 Mathematical Contest in Modeling.
  body: >-
    I am honored to receive my first international award in Mathematics.
- date: '2016-11-16'
  title: I was awarded my first National Scholarship for my study at Tongji University, Shanghai, China.
  body: >-
    The Ministry of Education of China funded the China National Scholarship to award outstanding full-time undergraduates for their excellent academic records. Being among the top 1% of the students of the same year, I am honored to receive this award.
